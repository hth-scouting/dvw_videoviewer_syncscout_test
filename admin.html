<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SyncScout Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f2f5; --surface: #fff; --text: #1a1d26; --text-secondary: #5a6072;
  --text-muted: #8b91a0; --border: #e2e5eb; --primary: #4f6ef7; --primary-hover: #3b5de6;
  --danger: #e53935; --success: #2e7d32; --warning: #ef6c00;
  --radius: 12px; --shadow: 0 4px 12px rgba(0,0,0,0.06);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #16192a, #1a2040);
}
.login-card {
  background: var(--surface); border-radius: 20px; padding: 36px 32px;
  width: 100%; max-width: 360px; box-shadow: 0 24px 80px rgba(0,0,0,0.4);
}
.login-card h1 { margin: 0 0 8px; font-size: 1.4rem; font-weight: 800; }
.login-card p { margin: 0 0 24px; color: var(--text-muted); font-size: 0.85rem; }
.login-card input {
  width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
  font-size: 1rem; outline: none; margin-bottom: 16px;
}
.login-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,0.15); }
.login-card button {
  width: 100%; padding: 13px; border: none; border-radius: 10px; background: var(--primary);
  color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
}
.login-card button:hover { background: var(--primary-hover); }
.login-err { color: var(--danger); font-size: 0.8rem; text-align: center; min-height: 1.2em; margin-top: 12px; }

.app { display: none; }
.topbar {
  background: #16192a; color: #fff; padding: 14px 24px; display: flex;
  align-items: center; justify-content: space-between;
}
.topbar h1 { margin: 0; font-size: 1.1rem; font-weight: 800; }
.topbar button {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.7); padding: 6px 14px; border-radius: 8px;
  font-size: 0.78rem; font-weight: 600; cursor: pointer;
}
.topbar button:hover { background: rgba(255,255,255,0.15); color: #fff; }

.container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

.actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.btn {
  padding: 10px 18px; border: none; border-radius: 8px; font-size: 0.82rem;
  font-weight: 700; cursor: pointer; font-family: inherit;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-outline {
  background: none; border: 1px solid var(--border); color: var(--text-secondary);
}
.btn-outline:hover { background: var(--bg); }
.btn-sm { padding: 6px 12px; font-size: 0.75rem; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow);
}
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
th { background: var(--bg); text-align: left; padding: 10px 14px; font-weight: 700;
     color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; }
td { padding: 12px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: rgba(79,110,247,0.02); }

.badge {
  display: inline-block; padding: 3px 10px; border-radius: 100px;
  font-size: 0.68rem; font-weight: 700;
}
.badge-active { background: rgba(46,125,50,0.1); color: var(--success); }
.badge-inactive { background: rgba(229,57,53,0.1); color: var(--danger); }
.badge-expired { background: rgba(239,108,0,0.1); color: var(--warning); }

.mono { font-family: 'IBM Plex Mono', 'Consolas', monospace; font-size: 0.78rem; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 100; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border-radius: 16px; padding: 28px;
  width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.modal h2 { margin: 0 0 20px; font-size: 1.15rem; font-weight: 700; }
.fm-group { margin-bottom: 16px; }
.fm-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.fm-group input, .fm-group select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 0.9rem; outline: none;
}
.fm-group input:focus { border-color: var(--primary); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

.copy-toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #16192a; color: #fff; padding: 10px 20px; border-radius: 100px;
  font-size: 0.82rem; font-weight: 600; display: none; z-index: 200;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.copy-toast.show { display: block; }

.result-box {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 16px; margin-top: 16px; display: none;
}
.result-box.show { display: block; }
.result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.result-row:last-child { margin-bottom: 0; }
.result-label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
.result-value { font-family: monospace; font-weight: 700; font-size: 0.9rem; }

@media (max-width: 640px) {
  .container { padding: 12px 8px; }
  th, td { padding: 8px 10px; }
  .hide-mobile { display: none; }
}
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>SyncScout Admin</h1>
    <p>Enter the admin password to manage teams.</p>
    <input type="password" id="adminPass" placeholder="Admin password" autofocus
           onkeydown="if(event.key==='Enter')adminLogin()">
    <button onclick="adminLogin()">Log In</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- App -->
<div class="app" id="app">
  <div class="topbar">
    <h1>SyncScout Admin</h1>
    <button onclick="adminLogout()">Logout</button>
  </div>

  <div class="container">
    <div class="actions-bar">
      <div style="font-size:0.85rem;color:var(--text-secondary)" id="teamCount">0 teams</div>
      <button class="btn btn-primary" onclick="openCreateModal()">+ New Team</button>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Team</th>
            <th>Slug</th>
            <th>Status</th>
            <th>Licence</th>
            <th class="hide-mobile">Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="teamList"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Create / Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">New Team</h2>
    <input type="hidden" id="editId">
    <div class="fm-group">
      <label>Team Name</label>
      <input type="text" id="fmName" placeholder="e.g. Blue Tigers">
    </div>
    <div class="fm-group">
      <label>Slug (auto-generated if empty)</label>
      <input type="text" id="fmSlug" placeholder="e.g. blue-tigers">
    </div>
    <div class="fm-group">
      <label>Licence End Date</label>
      <input type="date" id="fmLicence">
    </div>
    <div class="fm-group" id="fmActiveGroup" style="display:none">
      <label>Active</label>
      <select id="fmActive"><option value="true">Active</option><option value="false">Inactive</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modalSubmit" onclick="submitModal()">Create</button>
    </div>
    <div class="result-box" id="resultBox">
      <div class="result-row">
        <span class="result-label">Slug</span>
        <span class="result-value" id="resSlug"></span>
      </div>
      <div class="result-row">
        <span class="result-label">Passcode</span>
        <span class="result-value" id="resPass"></span>
      </div>
      <button class="btn btn-outline btn-sm" style="width:100%;margin-top:10px" onclick="copyCredentials()">Copy credentials</button>
    </div>
  </div>
</div>

<div class="copy-toast" id="toast">Copied!</div>

<script>
const SUPABASE_URL = 'https://ciokifeakrkigonhwbyf.supabase.co';
const API_URL = `${SUPABASE_URL}/functions/v1/admin-api`;
let adminKey = sessionStorage.getItem('admin_key') || '';

if (adminKey) showApp();

function adminLogin() {
  const pass = document.getElementById('adminPass').value.trim();
  if (!pass) { document.getElementById('loginErr').textContent = 'Please enter password'; return; }
  adminKey = pass;
  sessionStorage.setItem('admin_key', adminKey);
  showApp();
}

function adminLogout() {
  adminKey = '';
  sessionStorage.removeItem('admin_key');
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
}

function showApp() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadTeams();
}

async function api(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-admin-key': adminKey },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) {
    if (res.status === 401) { adminLogout(); alert('Invalid admin password'); return null; }
    alert('Error: ' + (data.error || 'Unknown'));
    return null;
  }
  return data;
}

async function loadTeams() {
  const res = await api({ action: 'list' });
  if (!res) return;
  const list = document.getElementById('teamList');
  const teams = res.teams || [];
  document.getElementById('teamCount').textContent = teams.length + ' team' + (teams.length !== 1 ? 's' : '');

  list.innerHTML = teams.map(t => {
    const today = new Date(); today.setHours(0,0,0,0);
    const expired = t.licence_end_date && today > new Date(t.licence_end_date);
    const statusBadge = !t.is_active
      ? '<span class="badge badge-inactive">Inactive</span>'
      : expired
        ? '<span class="badge badge-expired">Expired</span>'
        : '<span class="badge badge-active">Active</span>';
    const created = new Date(t.created_at).toLocaleDateString();
    return `<tr>
      <td><strong>${esc(t.team_name)}</strong></td>
      <td class="mono">${esc(t.slug)}</td>
      <td>${statusBadge}</td>
      <td class="mono">${esc(t.licence_end_date || '—')}</td>
      <td class="hide-mobile">${created}</td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="openEditModal(${t.id}, '${esc(t.team_name)}', '${esc(t.slug)}', '${t.licence_end_date||''}', ${t.is_active})">Edit</button>
        <button class="btn btn-outline btn-sm" onclick="resetPasscode(${t.id}, '${esc(t.team_name)}')">Reset PW</button>
      </td>
    </tr>`;
  }).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function openCreateModal() {
  document.getElementById('modalTitle').textContent = 'New Team';
  document.getElementById('editId').value = '';
  document.getElementById('fmName').value = '';
  document.getElementById('fmSlug').value = '';
  document.getElementById('fmSlug').disabled = false;
  document.getElementById('fmLicence').value = '';
  document.getElementById('fmActiveGroup').style.display = 'none';
  document.getElementById('modalSubmit').textContent = 'Create';
  document.getElementById('modalSubmit').style.display = '';
  document.getElementById('resultBox').classList.remove('show');
  document.getElementById('modal').classList.add('show');
}

function openEditModal(id, name, slug, licence, active) {
  document.getElementById('modalTitle').textContent = 'Edit Team';
  document.getElementById('editId').value = id;
  document.getElementById('fmName').value = name;
  document.getElementById('fmSlug').value = slug;
  document.getElementById('fmSlug').disabled = true;
  document.getElementById('fmLicence').value = licence;
  document.getElementById('fmActiveGroup').style.display = 'block';
  document.getElementById('fmActive').value = String(active);
  document.getElementById('modalSubmit').textContent = 'Save';
  document.getElementById('modalSubmit').style.display = '';
  document.getElementById('resultBox').classList.remove('show');
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  document.getElementById('fmSlug').disabled = false;
}

async function submitModal() {
  const id = document.getElementById('editId').value;
  const name = document.getElementById('fmName').value.trim();
  const slug = document.getElementById('fmSlug').value.trim();
  const licence = document.getElementById('fmLicence').value;

  if (!name || !licence) { alert('Please fill in team name and licence date'); return; }

  if (id) {
    const res = await api({
      action: 'update', id: Number(id),
      team_name: name, licence_end_date: licence,
      is_active: document.getElementById('fmActive').value === 'true',
    });
    if (res) { closeModal(); loadTeams(); }
  } else {
    const res = await api({ action: 'create', team_name: name, slug: slug || undefined, licence_end_date: licence });
    if (res && res.team) {
      document.getElementById('resSlug').textContent = res.team.slug;
      document.getElementById('resPass').textContent = res.generated_passcode;
      document.getElementById('resultBox').classList.add('show');
      document.getElementById('modalSubmit').style.display = 'none';
      loadTeams();
    }
  }
}

async function resetPasscode(id, name) {
  if (!confirm(`Reset passcode for "${name}"?\nThe old passcode will stop working immediately.`)) return;
  const res = await api({ action: 'update', id, reset_passcode: true });
  if (res && res.new_passcode) {
    alert('New passcode: ' + res.new_passcode + '\n\nPlease share this with the team.');
    loadTeams();
  }
}

function copyCredentials() {
  const slug = document.getElementById('resSlug').textContent;
  const pass = document.getElementById('resPass').textContent;
  navigator.clipboard.writeText(`Team ID: ${slug}\nPasscode: ${pass}`).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  });
}
</script>
</body>
</html>
