<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5MRSVH1C6H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5MRSVH1C6H');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>SyncScout v0.8.32</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body onclick="hideAllTagPopups()">

<header id="global-header">
    <div class="brand">
        <span class="brand-logo">S</span>
        <span class="brand-text">SyncScout</span>
        <span id="team-badge" class="team-badge"></span>
    </div>

    <!-- PC: category tabs -->
    <div id="catTabs" class="cat-tabs pc-only"></div>

    <!-- Mobile: category select -->
    <select id="catSelectMobile" class="mobile-only" onchange="changeCategoryMobile(this.value)"></select>

    <!-- Shared: match select -->
    <select id="matchSelect" class="header-match-select" onchange="onMatchChange(this.value)">
        <option value="" data-i18n="select_match">Select Match...</option>
    </select>

    <!-- Single menu button (PC & mobile) -->
    <button class="menu-toggle-btn" onclick="toggleAppMenu()" id="app-menu-toggle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <!-- Unified dropdown menu -->
    <div id="app-menu" class="app-menu">
        <button class="app-menu-item" onclick="document.getElementById('add-match-modal').style.display='flex'; toggleAppMenu();">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="add_match">Add Match</span>
        </button>
        <button class="app-menu-item danger-item" id="menu-delete-match" onclick="deleteMatch(); toggleAppMenu();" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14"/></svg>
            <span data-i18n="delete_match">Delete Match</span>
        </button>
        <div class="app-menu-divider"></div>
        <button class="app-menu-item" onclick="toggleLang(); toggleAppMenu();">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
            <span id="lang-menu-label">English / 日本語</span>
        </button>
        <a href="sync_scout_manual.html" target="_blank" class="app-menu-item" onclick="toggleAppMenu();">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
            <span>Manual</span>
        </a>
        <div class="app-menu-divider"></div>
        <button class="app-menu-item danger-item" onclick="logout();">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span data-i18n="logout">Logout</span>
        </button>
    </div>
</header>

<div id="main-workspace">
    <div id="video-side">
        <div id="player-box" onclick="toggleOverlay()">
            <div id="player"></div>
            <div id="score-overlay" class="vid-ui">
                <div class="score-row home"><div class="sticky-bar"></div><div class="ov-team-box" id="ov-h-code">---</div><div class="ov-sets-box" id="ov-h-sets">0</div><div class="ov-points-box" id="ov-h-score">0</div></div>
                <div class="score-row away"><div class="sticky-bar"></div><div class="ov-team-box" id="ov-a-code">---</div><div class="ov-sets-box" id="ov-a-sets">0</div><div class="ov-points-box" id="ov-a-score">0</div></div>
            </div>
            <button class="video-nav-btn nav-prev vid-ui" onclick="event.stopPropagation(); playPrev()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <button class="video-nav-btn nav-next vid-ui" onclick="event.stopPropagation(); playNext()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
            <button class="seek-btn seek-back vid-ui" onclick="event.stopPropagation(); seekSeconds(-3)">-3s</button>
            <button class="seek-btn seek-repeat vid-ui" onclick="event.stopPropagation(); replayCurrentPlay()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
            </button>
            <button class="seek-btn seek-fwd vid-ui" onclick="event.stopPropagation(); seekSeconds(3)">+3s</button>
        </div>
        <canvas id="telestratorCanvas"></canvas>
        <div id="draw-toolbar">
            <div id="draw-tools">
                <button class="tool-btn active" onclick="setDrawTool('freehand')" id="tool-freehand">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17c3-3 6-7 9-7s3 4 6 4 3-2 3-2"/></svg>
                </button>
                <button class="tool-btn" onclick="setDrawTool('arrow')" id="tool-arrow">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="12 5 19 5 19 12"/></svg>
                </button>
                <button class="tool-btn" onclick="setDrawTool('circle')" id="tool-circle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
                </button>
                <button class="tool-btn" onclick="setDrawTool('rect')" id="tool-rect">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                </button>
            </div>
            <button class="draw-btn" onclick="undoDrawing()" data-i18n="undo">Undo</button>
            <button class="draw-btn" onclick="clearCanvas()" data-i18n="clear">Clear</button>
            <button class="draw-btn cancel" onclick="exitDrawMode()" data-i18n="cancel">Cancel</button>
            <button class="draw-btn save" onclick="saveDrawing()" data-i18n="save_draw">Save (P)</button>
        </div>
    </div>

    <div id="control-side">
        <div class="mode-tabs">
            <button class="mode-tab active" id="btn-rally" onclick="setMode('rally')" data-i18n="rallies">Rallies</button>
            <button class="mode-tab" id="btn-player" onclick="setMode('player')" data-i18n="individual">Individual</button>
            <button class="mode-tab" id="btn-stats" onclick="setMode('stats')" data-i18n="table">Table</button>
            <button class="mode-tab" id="btn-rotation" onclick="setMode('rotation')" data-i18n="rotation">Rotation</button>
        </div>

        <div class="filter-card" id="filterArea">
            <div id="rally-filters"><span class="filter-label" data-i18n="server_team">1. Server Team</span><select id="teamFilterRally" onchange="render()"><option value="" data-i18n="both_teams">Both Teams</option></select></div>
            <div id="player-filters" style="display:none;">
                <div class="pf-grid">
                    <div class="pf-item">
                        <span class="filter-label" data-i18n="filter_team">1. Team</span>
                        <select id="teamFilterPlayer" onchange="onTeamChangePlayer()"><option value="" data-i18n="select_team">Select Team</option></select>
                    </div>
                    <div class="pf-item">
                        <span class="filter-label" data-i18n="filter_player">2. Player</span>
                        <select id="playerFilter" onchange="render()"><option value="" data-i18n="all_players">All Players</option></select>
                    </div>
                    <div class="pf-item">
                        <span class="filter-label" data-i18n="filter_skill">3. Skill</span>
                        <select id="skillFilter" onchange="render()"><option value="" data-i18n="all">All</option><option value="S">Serve</option><option value="R">Rec</option><option value="E">Set</option><option value="A">Attack</option><option value="B">Block</option><option value="D">Dig</option></select>
                    </div>
                    <div class="pf-item">
                        <span class="filter-label" data-i18n="filter_effect">4. Effect</span>
                        <select id="effectFilter" onchange="render()"><option value="" data-i18n="all">All</option><option value="#">Win (#)</option><option value="=">Error (=)</option><option value="+">Pos (+)</option><option value="-">Poor (-)</option><option value="!">Neutral (!)</option></select>
                    </div>
                </div>
            </div>
            <button class="toggle-search-btn" onclick="toggleSearchArea()">
                <span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:-2px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <span data-i18n="search_comments">Search Comments / Tags</span>
                </span>
                <span id="searchArrow">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>
                </span>
            </button>
            <div class="search-container" id="searchArea">
                <input type="text" id="searchFilter" class="search-input" oninput="render()" data-i18n-placeholder="search_placeholder" placeholder="Keyword (e.g. #MB, #Good)">
                <div class="share-row">
                    <button class="share-btn copy" onclick="copyPlaylistLink()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
                        <span data-i18n="copy_url">Copy URL</span>
                    </button>
                    <button class="share-btn line" onclick="sharePlaylist()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 5.82 2 10.5c0 3.29 2.34 6.16 5.84 7.55-.08.7-.43 2.58-.5 2.98-.08.52.19.51.4.37.17-.11 2.62-1.78 3.68-2.5.85.12 1.72.1 2.58.1 5.52 0 10-3.82 10-8.5S17.52 2 12 2z"/></svg>
                        <span data-i18n="share_line">Share LINE</span>
                    </button>
                </div>
            </div>
            <label class="auto-skip-label">
                <input type="checkbox" id="autoNext" checked>
                <span class="checkbox-custom"></span>
                <span data-i18n="auto_skip">Auto-Skip</span>
            </label>
        </div>
        <div id="instanceList"></div>
    </div>
</div>

<div id="add-match-modal" onclick="this.style.display='none'">
    <div class="add-match-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 data-i18n="add_new_match">Add New Match</h3>
            <button class="modal-close" onclick="document.getElementById('add-match-modal').style.display='none'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="fm-group">
            <label data-i18n="category">Category</label>
            <input type="text" id="am-cat" list="existing-cats" data-i18n-placeholder="cat_placeholder" placeholder="Select or type new category" autocomplete="off">
            <datalist id="existing-cats"></datalist>
        </div>
        <div class="fm-group"><label>YouTube URL</label><input type="text" id="am-yt" placeholder="https://youtu.be/..."></div>
        <div class="fm-group"><label data-i18n="dvw_file">DVW File</label><input type="file" id="am-file" accept=".dvw"></div>
        <button class="add-btn-submit" id="am-submit-btn" onclick="submitNewMatch()" data-i18n="upload_save">Upload & Save</button>
    </div>
</div>

<button id="shortcut-btn" onclick="toggleShortcuts()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h8M6 16h.01M18 16h.01M10 16h4"/></svg>
</button>
<div id="shortcut-modal" onclick="toggleShortcuts()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 data-i18n="shortcuts">Keyboard Shortcuts</h3>
        <ul>
            <li><span data-i18n="sc_next_prev">Next / Prev</span> <span class="kbd-group"><kbd>F</kbd> / <kbd>D</kbd></span></li>
            <li><span data-i18n="sc_repeat">Repeat</span> <kbd>R</kbd></li>
            <li><span data-i18n="sc_seek">-2s / +2s</span> <span class="kbd-group"><kbd>←</kbd> / <kbd>→</kbd></span></li>
            <li><span data-i18n="sc_draw">Draw On/Save</span> <kbd>P</kbd></li>
            <li><span data-i18n="sc_undo">Undo Draw</span> <span class="kbd-group"><kbd>Ctrl</kbd>+<kbd>Z</kbd></span></li>
            <li><span data-i18n="sc_note">Focus Note</span> <kbd>C</kbd></li>
            <li><span data-i18n="sc_submit">Submit</span> <kbd>Enter</kbd></li>
            <li><span data-i18n="sc_tag">Select Tag</span> <span class="kbd-group"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>Enter</kbd></span></li>
        </ul>
        <button class="close-modal-btn" onclick="toggleShortcuts()" data-i18n="close">Close</button>
    </div>
</div>

<script src="app.js?v=2.1.0"></script>

</body>
</html>
